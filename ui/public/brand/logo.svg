    <path d="M10.5 19.1 l1.15 2.35 2.35 1.15 -2.35 1.15 -1.15 2.35 -1.15 -2.35 -2.35 -1.15 2.35 -1.15 z" fill="#0F8EFB"/>
    <path d="M53.5 19.1 l1.15 2.35 2.35 1.15 -2.35 1.15 -1.15 2.35 -1.15 -2.35 -2.35 -1.15 2.35 -1.15 z" fill="#EF6B2A"/>
    <path d="M16.5 47.5 L16.5 31 L31.5 44 L44 31.5 L48.5 26"
          fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="66" y="36"
        font-family="Poppins, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="600" letter-spacing="0.4" fill="#081120">Maya</text>

  <!-- Tagline, set the way the parent brand sets its own -->
  <text x="67.5" y="50"
