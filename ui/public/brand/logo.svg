<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" width="268" height="64" role="img" aria-label="Maya - QA Automation Studio">
  <title>Maya - QA Automation Studio</title>
  <defs>
    <linearGradient id="mayaArcLockup" x1="10" y1="20" x2="54" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F8EFB"/>
      <stop offset="0.52" stop-color="#7A4FC8"/>
      <stop offset="1" stop-color="#EF6B2A"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(0 6) scale(0.8125)">
